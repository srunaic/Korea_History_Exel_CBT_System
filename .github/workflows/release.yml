name: "Release Educational CBT System"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Release Package
        run: |
          mkdir -p dist
          if [ -f "한국사_토익_통합_CBT_교구재_v2.0.0.zip" ]; then
            cp "한국사_토익_통합_CBT_교구재_v2.0.0.zip" dist/
          else
            zip -r dist/한국사_토익_통합_CBT_교구재_v2.0.0.zip *.html *.xlsx README.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "한국사 & 토익 통합 실전 교구재 배포판 (${{ github.ref_name }})"
          body: |
            ## 🎓 한국사능력검정시험 & 토익(TOEIC) 통합 실전 교구재 시스템 v2.0.0

            ### 📦 최신 기능 안내
            1. **🇰🇷 한국사능력검정시험(심화) 실전 CBT (77문항)**
               - 국사편찬위원회 기출 77개 불변 공식 및 줄글 사료 원문 100% 수록
               - 1문제 집중 모드, 전체 모아보기, 1초 해설/암기팁 탑재
               - iOS & Android 모바일 반응형 완벽 최적화
            2. **🇬🇧 토익(TOEIC) 800+ 실전 CBT (30문항)**
               - Listening (LC): Part 1 사진 묘사 그래픽 및 브라우저 원어민 오디오 음성(1.0x/1.2x) 내장
               - Reading (RC): Part 5 최빈출 10대 문법 공식, Part 6 장문공란, Part 7 실전 독해
               - Listening / Reading / 정답해설집 분리형 엑셀 워크북 제공

            ### 📥 다운로드 안내
            아래 **Assets**에서 `한국사_토익_통합_CBT_교구재_v2.0.0.zip`을 다운로드하여 압축을 풀고 더블클릭하여 바로 사용하세요!
          files: |
            dist/*.zip
            *.html
            *.xlsx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
