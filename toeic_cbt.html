: "RC", "category": "Sentence Insertion (단락 마무리 문장 삽입)", "question": "Choose the sentence that best fits the blank [ 134 ].", "passage": "MEMORANDUM\n\nTo: All Department Heads\nFrom: Corporate Operations\nDate: October 5\nSubject: Office Renovation and Remote Work\n\nStarting next Monday, our headquarters will undergo extensive interior renovations on the 4th and 5th floors. [ 131 ], all staff members in these divisions are encouraged to work remotely until construction concludes on October 25.\n\nEmployees requiring physical access to company servers must request temporary badge clearance at least 24 hours in advance. [ 132 ] Please direct all inquiries to facility management.\n\nWe recognize that this disruption may present minor logistical challenges. Management is committed to providing all necessary technical equipment to ensure that your home workstations remain fully [ 133 ]. If you need additional laptop docks or external monitors, please contact IT support before Friday.\n\n[ 134 ] We appreciate your patience and flexibility as we modernize our work environment.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Regular on-site operations are anticipated to resume smoothly on Monday, October 28.", "The company picnic has been scheduled for next summer.", "All construction contractors must show their driving licenses.", "Our quarterly earnings report is available online."], "answer": 0, "explanation": "[정답 분석] 10월 25일 공사 완료 후 10월 28일 월요일부터 정상 현장 업무가 재개될 것이라는 자연스러운 일정 안내인 (A)가 정답입니다.", "vocabulary": "on-site operations(현장 업무); resume smoothly(원활히 재개되다)"}, {"id": 135, "part": "Part 6", "section": "RC", "category": "Grammar (현재완료 시제)", "question": "Choose the word that best completes the blank [ 135 ].", "passage": "Dear Valued Customer,\n\nWe appreciate your continued trust in Meridian Bank. Over the past six months, our technology team [ 135 ] a brand-new mobile banking application designed to provide faster international money transfers. We are delighted to announce that this app is now available for download.\n\nWith our updated platform, you can effortlessly manage recurring utility payments, monitor exchange rates in real time, and lock credit cards with a single tap. [ 136 ] To celebrate this milestone, we are offering a promotional cash-back reward for all users who complete their first mobile transaction before November 30.\n\nTo register for the upcoming regional financial seminar introducing this technology, participants must submit their registration form online. Please note that spaces are [ 137 ], and reservations will be processed on a first-come, first-served basis.\n\nShould you require any assistance navigating the new application, our digital banking support team is available 24 hours a day. We look forward to [ 138 ] you with an even higher standard of banking excellence.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["has developed", "will develop", "developed", "was developing"], "answer": 0, "explanation": "[1초 공식: Over the past + 기간 = 현재완료]<br>'Over the past six months(지난 6개월 동안)'는 과거부터 현재까지 이어진 기간을 나타내므로 현재완료 시제인 (A) has developed가 정답입니다.", "vocabulary": "over the past + 기간(지난 ~동안); brand-new(신규의); money transfer(송금)"}, {"id": 136, "part": "Part 6", "section": "RC", "category": "Sentence Insertion (문맥 문장 삽입)", "question": "Choose the sentence that best fits the blank [ 136 ].", "passage": "Dear Valued Customer,\n\nWe appreciate your continued trust in Meridian Bank. Over the past six months, our technology team [ 135 ] a brand-new mobile banking application designed to provide faster international money transfers. We are delighted to announce that this app is now available for download.\n\nWith our updated platform, you can effortlessly manage recurring utility payments, monitor exchange rates in real time, and lock credit cards with a single tap. [ 136 ] To celebrate this milestone, we are offering a promotional cash-back reward for all users who complete their first mobile transaction before November 30.\n\nTo register for the upcoming regional financial seminar introducing this technology, participants must submit their registration form online. Please note that spaces are [ 137 ], and reservations will be processed on a first-come, first-served basis.\n\nShould you require any assistance navigating the new application, our digital banking support team is available 24 hours a day. We look forward to [ 138 ] you with an even higher standard of banking excellence.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Biometric login features provide state-of-the-art protection for all accounts.", "The bank branch will be permanently closed next month.", "Cash withdrawals can only be made in foreign currency.", "Personal checks will no longer be accepted by vendors."], "answer": 0, "explanation": "[정답 분석] 모바일 앱의 편리한 기능(공과금 결제, 실시간 환율)을 소개하는 문맥에 이어 보안 기능(생체 인식 로그인)을 설명하는 (A)가 완벽합니다.", "vocabulary": "biometric login(생체 인식 로그인); state-of-the-art protection(최첨단 보안 보호)"}, {"id": 137, "part": "Part 6", "section": "RC", "category": "Vocabulary (문맥 어휘 빈출)", "question": "Choose the word that best completes the blank [ 137 ].", "passage": "Dear Valued Customer,\n\nWe appreciate your continued trust in Meridian Bank. Over the past six months, our technology team [ 135 ] a brand-new mobile banking application designed to provide faster international money transfers. We are delighted to announce that this app is now available for download.\n\nWith our updated platform, you can effortlessly manage recurring utility payments, monitor exchange rates in real time, and lock credit cards with a single tap. [ 136 ] To celebrate this milestone, we are offering a promotional cash-back reward for all users who complete their first mobile transaction before November 30.\n\nTo register for the upcoming regional financial seminar introducing this technology, participants must submit their registration form online. Please note that spaces are [ 137 ], and reservations will be processed on a first-come, first-served basis.\n\nShould you require any assistance navigating the new application, our digital banking support team is available 24 hours a day. We look forward to [ 138 ] you with an even higher standard of banking excellence.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["limited", "bound", "narrow", "slight"], "answer": 0, "explanation": "[1초 공식: spaces/seats are limited (인원이 한정된)]<br>뒤의 선착순(first-come, first-served) 단서와 어울려 좌석/인원이 제한되어 있음을 뜻하는 형용사는 (A) limited입니다.", "vocabulary": "spaces are limited(좌석이 한정되어 있다); first-come, first-served(선착순)"}, {"id": 138, "part": "Part 6", "section": "RC", "category": "Grammar (look forward to -ing)", "question": "Choose the word that best completes the blank [ 138 ].", "passage": "Dear Valued Customer,\n\nWe appreciate your continued trust in Meridian Bank. Over the past six months, our technology team [ 135 ] a brand-new mobile banking application designed to provide faster international money transfers. We are delighted to announce that this app is now available for download.\n\nWith our updated platform, you can effortlessly manage recurring utility payments, monitor exchange rates in real time, and lock credit cards with a single tap. [ 136 ] To celebrate this milestone, we are offering a promotional cash-back reward for all users who complete their first mobile transaction before November 30.\n\nTo register for the upcoming regional financial seminar introducing this technology, participants must submit their registration form online. Please note that spaces are [ 137 ], and reservations will be processed on a first-come, first-served basis.\n\nShould you require any assistance navigating the new application, our digital banking support team is available 24 hours a day. We look forward to [ 138 ] you with an even higher standard of banking excellence.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["serving", "serve", "served", "service"], "answer": 0, "explanation": "[1초 공식: look forward to + 동명사(-ing)]<br>'look forward to'의 to는 전치사이므로 뒤에 동명사인 (A) serving이 정답입니다.", "vocabulary": "look forward to -ing(~하기를 고대하다); standard of excellence(탁월한 기준)"}, {"id": 139, "part": "Part 6", "section": "RC", "category": "Vocabulary (명사 어휘 merger)", "question": "Choose the word that best completes the blank [ 139 ].", "passage": "FOR IMMEDIATE RELEASE\n\nSEATTLE — Apex Global Logistics today officially announced its strategic [ 139 ] with Pacific Freight Solutions. The combined enterprise will operate under the unified brand Apex-Pacific Global, creating one of the largest multimodal shipping networks in North America.\n\nThe merger is expected to yield substantial operational efficiencies, combining Apex's advanced warehousing technologies with Pacific's extensive maritime routes. [ 140 ] Under the terms of the agreement, current Apex CEO Marcus Vance will serve as Executive Chairman of the new conglomerate.\n\n\"This alliance allows us to deliver unprecedented value to our international commercial clients,\" stated Mr. Vance during this morning's press conference. \"We remain fully committed to [ 141 ] customer service standards throughout the operational transition.\"\n\nAll existing supply contracts and client agreements will remain fully honored without interruption. [ 142 ] Additional corporate filing documents have been submitted to regulatory authorities for standard review.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["merger", "termination", "hesitation", "demolition"], "answer": 0, "explanation": "[문맥 어휘 판별]<br>두 물류 회사가 결합한다는 문맥(combined enterprise)이므로 '합병'을 뜻하는 (A) merger가 정답입니다.", "vocabulary": "strategic merger(전략적 합병); combined enterprise(결합 기업); multimodal shipping(복합 운송)"}, {"id": 140, "part": "Part 6", "section": "RC", "category": "Sentence Insertion (문맥 문장 삽입)", "question": "Choose the sentence that best fits the blank ied brand Apex-Pacific Global, creating one of the largest multimodal shipping networks in North America.\n\nThe merger is expected to yield substantial operational efficiencies, combining Apex's advanced warehousing technologies with Pacific's extensive maritime routes. [ 140 ] Under the terms of the agreement, current Apex CEO Marcus Vance will serve as Executive Chairman of the new conglomerate.\n\n\"This alliance allows us to deliver unprecedented value to our international commercial clients,\" stated Mr. Vance during this morning's press conference. \"We remain fully committed to [ 141 ] customer service standards throughout the operational transition.\"\n\nAll existing supply contracts and client agreements will remain fully honored without interruption. [ 142 ] Additional corporate filing documents have been submitted to regulatory authorities for standard review.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["maintaining", "abandoning", "neglecting", "postponing"], "answer": 0, "explanation": "[문맥 어휘 판별]<br>통합 기간 동안 높은 고객 서비스 기준을 '유지하다'의 문맥이므로 (A) maintaining이 정답입니다. (abandon: 포기하다, neglect: 방치하다).", "vocabulary": "be committed to -ing(~에 전념하다); maintain standards(기준을 유지하다)"}, {"id": 142, "part": "Part 6", "section": "RC", "category": "Sentence Insertion (문맥 문장 삽입)", "question": "Choose the sentence that best fits the blank [ 142 ].", "passage": "FOR IMMEDIATE RELEASE\n\nSEATTLE — Apex Global Logistics today officially announced its strategic [ 139 ] with Pacific Freight Solutions. The combined enterprise will operate under the unified brand Apex-Pacific Global, creating one of the largest multimodal shipping networks in North America.\n\nThe merger is expected to yield substantial operational efficiencies, combining Apex's advanced warehousing technologies with Pacific's extensive maritime routes. [ 140 ] Under the terms of the agreement, current Apex CEO Marcus Vance will serve as Executive Chairman of the new conglomerate.\n\n\"This alliance allows us to deliver unprecedented value to our international commercial clients,\" stated Mr. Vance during this morning's press conference. \"We remain fully committed to [ 141 ] customer service standards throughout the operational transition.\"\n\nAll existing supply contracts and client agreements will remain fully honored without interruption. [ 142 ] Additional corporate filing documents have been submitted to regulatory authorities for standard review.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Clients will continue to interact with their dedicated account representatives as usual.", "All regional branches will be closed permanently by midnight.", "Employees must return their company laptops immediately.", "The stock market will remain closed for the rest of the year."], "answer": 0, "explanation": "[정답 분석] 앞 문장의 기존 계약이 중단 없이 유지된다는 내용에 이어, 고객들이 기존 전담 담당자와 계속 소통할 수 있다는 안심 안내문인 (A)가 정답입니다.", "vocabulary": "dedicated account representative(전담 계정 담당자); interact as usual(평소처럼 소통하다)"}, {"id": 143, "part": "Part 6", "section": "RC", "category": "Vocabulary (동사 어휘 establish)", "question": "Choose the word that best completes the blank [ 143 ].", "passage": "INTERNAL MEMORANDUM\n\nTo: All Staff Members\nFrom: Human Resources Division\nDate: November 1\nSubject: Annual Performance Evaluations and Goal Setting\n\nAs we approach the conclusion of the fourth quarter, it is time to initiate our annual performance appraisal process. This annual review provides an invaluable opportunity for employees and managers to reflect on individual accomplishments and [ 143 ] strategic professional goals for the coming year.\n\nAll employees must complete their self-assessment forms via the employee portal by Friday, November 17. Following the submission deadline, department supervisors will schedule one-on-one review meetings to discuss achievements and professional development plans. [ 144 ]\n\nPlease ensure that all supporting documentation, such as client praise letters and sales records, is uploaded [ 145 ] to your evaluation file. Incomplete submissions may delay eligibility for annual salary adjustments and merit bonuses.\n\n[ 146 ] We thank you for your hard work and dedication throughout this exceptionally productive year.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["establish", "demolish", "dismiss", "hesitate"], "answer": 0, "explanation": "[1초 공식: establish goals (목표를 수립하다)]<br>새해를 위한 전략적 전문 목표를 '수립하다'를 나타내는 동사는 (A) establish입니다.", "vocabulary": "performance appraisal(인사 고과/성과 평가); establish goals(목표를 세우다); accomplishment(성과)"}, {"id": 144, "part": "Part 6", "section": "RC", "category": "Sentence Insertion (문맥 문장 삽입)", "question": "Choose the sentence that best fits the blank [ 144 ].", "passage": "INTERNAL MEMORANDUM\n\nTo: All Staff Members\nFrom: Human Resources Division\nDate: November 1\nSubject: Annual Performance Evaluations and Goal Setting\n\nAs we approach the conclusion of the fourth quarter, it is time to initiate our annual performance appraisal process. This annual review provides an invaluable opportunity for employees and managers to reflect on individual accomplishments and [ 143 ] strategic professional goals for the coming year.\n\nAll employees must complete their self-assessment forms via the employee portal by Friday, November 17. Following the submission deadline, department supervisors will schedule one-on-one review meetings to discuss achievements and professional development plans. [ 144 ]\n\nPlease ensure that all supporting documentation, such as client praise letters and sales records, is uploaded [ 145 ] to your evaluation file. Incomplete submissions may delay eligibility for annual salary adjustments and merit bonuses.\n\n[ 146 ] We thank you for your hard work and dedication throughout this exceptionally productive year.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["These meetings are scheduled to occur between November 20 and December 8.", "The company holiday party will be held at a local resort.", "Parking validation stamps must be obtained from building security.", "Office supplies should be ordered directly from the catalog."], "answer": 0, "explanation": "[정답 분석] 앞 문장의 부서장과의 1:1 면담 일정 논의에 이어 구체적 면담 진행 기간(11월 20일~12월 8일)을 제시한 (A)가 가장 적절합니다.", "vocabulary": "one-on-one meeting(1:1 면담); occur(열리다, 발생하다)"}, {"id": 145, "part": "Part 6", "section": "RC", "category": "Grammar (동사 수식 부사 directly)", "question": "Choose the word that best completes the blank [ 145 ].", "passage": "INTERNAL MEMORANDUM\n\nTo: All Staff Members\nFrom: Human Resources Division\nDate: November 1\nSubject: Annual Performance Evaluations and Goal Setting\n\nAs we approach the conclusion of the fourth quarter, it is time to initiate our annual performance appraisal process. This annual review provides an invaluable opportunity for employees and managers to reflect on individual accomplishments and [ 143 ] strategic professional goals for the coming year.\n\nAll employees must complete their self-assessment forms via the employee portal by Friday, November 17. Following the submission deadline, department supervisors will schedule one-on-one review meetings to discuss achievements and professional development plans. [ 144 ]\n\nPlease ensure that all supporting documentation, such as client praise letters and sales records, is uploaded [ 145 ] to your evaluation file. Incomplete submissions may delay eligibility for annual salary adjustments and merit bonuses.\n\n[ 146 ] We thank you for your hard work and dedication throughout this exceptionally productive year.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["directly", "direct", "direction", "directness"], "answer": 0, "explanation": "[1초 공식: be uploaded [부사] to ~]<br>수동태 동사 is uploaded를 뒤에서 수식하는 부사이므로 (A) directly가 정답입니다.", "vocabulary": "supporting documentation(증빙 서류); upload directly(직접 업로드하다)"}, {"id": 146, "part": "Part 6", "section": "RC", "category": "Sentence Insertion (마무리 문장 삽입)", "question": "Choose the sentence that best fits the blank [ 146 ].", "passage": "INTERNAL MEMORANDUM\n\nTo: All Staff Members\nFrom: Human Resources Division\nDate: November 1\nSubject: Annual Performance Evaluations and Goal Setting\n\nAs we approach the conclusion of the fourth quarter, it is time to initiate our annual performance appraisal process. This annual review provides an invaluable opportunity for employees and managers to reflect on individual accomplishments and [ 143 ] strategic professional goals for the coming year.\n\nAll employees must complete their self-assessment forms via the employee portal by Friday, November 17. Following the submission deadline, department supervisors will schedule one-on-one review meetings to discuss achievements and professional development plans. [ 144 ]\n\nPlease ensure that all supporting documentation, such as client praise letters and sales records, is uploaded [ 145 ] to your evaluation file. Incomplete submissions may delay eligibility for annual salary adjustments and merit bonuses.\n\n[ 146 ] We thank you for your hard work and dedication throughout this exceptionally productive year.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Should you have questions regarding the evaluation criteria, please contact HR.", "All company vehicles must undergo emission inspections this week.", "Lunch vouchers will be distributed to warehouse staff on Monday.", "The building fire alarm will be tested tomorrow morning."], "answer": 0, "explanation": "[정답 분석] 인사고과 안내문 마지막에 평가 기준에 대한 의문점이 있을 시 인사부로 문의하라는 표준 안내문인 (A)가 정답입니다.", "vocabulary": "evaluation criteria(평가 기준); contact HR(인사부에 문의하다)"}, {"id": 147, "part": "Part 7", "section": "RC", "category": "Detail (문맥 세부정보)", "question": "What did Mr. Baxter approve?", "passage": "TEXT MESSAGE CONVERSATION\n\nMark Davies [10:14 A.M.]:\nHi Karen, are you still at the design client's office? I need to know if they approved the color scheme for the brochure.\n\nKaren Mills [10:16 A.M.]:\nYes, Mr. Baxter loved the navy and emerald green layout! He just signed off on the proofs. I'm heading back to our studio now.\n\nMark Davies [10:18 A.M.]:\nThat's fantastic. Could you pick up a box of glossy cardstock from PrintSupply on your way back? We're completely out of stock.\n\nKaren Mills [10:19 A.M.]:\nSure thing. I'll be back at the office by 11:15 A.M.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["A website homepage design", "A color scheme for a brochure", "A corporate logo revision", "An advertising budget"], "answer": 1, "explanation": "[정답 분석] Karen의 문자에서 'Mr. Baxter loved the navy and emerald green layout! He just signed off on the proofs'라고 브로슈어 색상 배치를 승인했음을 알 수 있습니다.", "vocabulary": "color scheme(색상 구성); sign off on(승인하다); proof(교정본)"}, {"id": 148, "part": "Part 7", "section": "RC", "category": "Next Action (다음 행동 추론)", "question": "What will Karen Mills most likely do next?", "passage": "TEXT MESSAGE CONVERSATION\n\nMark Davies [10:14 A.M.]:\nHi Karen, are you still at the design client's office? I need to know if they approved the color scheme for the brochure.\n\nKaren Mills [10:16 A.M.]:\nYes, Mr. Baxter loved the navy and emerald green layout! He just signed off on the proofs. I'm heading back to our studio now.\n\nMark Davies [10:18 A.M.]:\nThat's fantastic. Could you pick up a box of glossy cardstock from PrintSupply on your way back? We're completely out of stock.\n\nKaren Mills [10:19 A.M.]:\nSure thing. I'll be back at the office by 11:15 A.M.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Cancel a printing contract", "Visit PrintSupply to purchase paper", "Call Mr. Baxter for clarification", "Meet Mark at the studio immediately"], "answer": 1, "explanation": "[정답 분석] Mark가 'pick up a box of glossy cardstock from PrintSupply on your way back'을 요청하자 'Sure thing'이라고 수락했으므로 인쇄용지 매장에 들를 것입니다.", "vocabulary": "cardstock(두꺼운 도화지/카드지); out of stock(재고가 떨어진)"}, {"id": 149, "part": "Part 7", "section": "RC", "category": "Main Idea (공지 목적)", "question": "What is the primary purpose of the notice?", "passage": "Notice to All Personnel:\n\nPlease be advised that effective December 1, Apex Solutions will implement an updated policy regarding business travel expense reimbursements. Under the new guidelines, all reimbursement requests must be submitted through the internal employee portal within 14 business days of returning from a trip.\n\nAdditionally, physical paper receipts will no longer be accepted. Employees must upload clear digital scans or photos of all original receipts, including lodging and transportation costs. Failure to submit claims within the designated timeframe may result in delays or denial of reimbursement.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["To announce changes to expense reimbursement procedures", "To inform staff of upcoming business travel schedules", "To provide instructions on downloading mobile software", "To introduce new personnel in the accounting department"], "answer": 0, "explanation": "[정답 분석] 첫 문장의 'will implement an updated policy regarding business travel expense reimbursements'에서 출장비 환급 규정 변경 공지임을 알 수 있습니다.", "vocabulary": "reimbursement(환급); effective + 날짜(~부로 발효되는); implement(시행하다)"}, {"id": 150, "part": "Part 7", "section": "RC", "category": "Detail (세부정보 매칭)", "question": "According to the notice, what is stated about receipts?", "passage": "Notice to All Personnel:\n\nPlease be advised that effective December 1, Apex Solutions will implement an updated policy regarding business travel expense reimbursements. Under the new guidelines, all reimbursement requests must be submitted through the internal employee portal within 14 business days of returning from a trip.\n\nAdditionally, physical paper receipts will no longer be accepted. Employees must upload clear digital scans or photos of all original receipts, including lodging and transportation costs. Failure to submit claims within the designated timeframe may result in delays or denial of reimbursement.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Paper receipts must be mailed to finance.", "They must be provided in an electronic format.", "Original copies must be submitted in person.", "Receipts under $20 do not require submission."], "answer": 1, "explanation": "[정답 분석] 본문의 'physical paper receipts will no longer be accepted. Employees must upload clear digital scans or photos'가 (B) provided in an electronic format으로 전환된 정답입니다.", "vocabulary": "electronic format(전자 형식); physical receipt(종이 영수증); upload(업로드하다)"}, {"id": 151, "part": "Part 7", "section": "RC", "category": "Detail (할인 적용 사유)", "question": "Why is a discount applied to the order?", "passage": "INVOICE #49201\nCrestview Office Furniture\nDate: September 14\nBill To: Horizon Legal Partners\n\nItem Description | Qty | Unit Price | Total\nErgonomic Desk Chairs | 15 | $220.00 | $3,300.00\nConference Table (8-seat) | 2 | $850.00 | $1,700.00\nSubtotal: $5,000.00\nCorporate Bulk Discount (10%): -$500.00\nDelivery Fee: WAIVED (Orders over $1,000)\nTotal Amount Due: $4,500.00\nPayment Terms: Net 30 days", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Because the items were purchased in large quantities", "Because the customer paid in advance using cash", "Because the merchandise was slightly damaged", "Because the order was placed during a holiday sale"], "answer": 0, "explanation": "[정답 분석] 청구서에 'Corporate Bulk Discount(10%)'라고 명시되어 있습니다. bulk discount(대량 구매 할인)는 대량(large quantities) 구매에 적용되므로 (A)가 정답입니다.", "vocabulary": "invoice(청구서); bulk discount(대량 구매 할인); large quantities(대량)"}, {"id": 152, "part": "Part 7", "section": "RC", "category": "Inference (청구서 연계 추론)", "question": "What is indicated about Horizon Legal Partners?", "passage": "INVOICE #49201\nCrestview Office Furniture\nDate: September 14\nBill To: Horizon Legal Partners\n\nItem Description | Qty | Unit Price | Total\nErgonomic Desk Chairs | 15 | $220.00 | $3,300.00\nConference Table (8-seat) | 2 | $850.00 | $1,700.00\nSubtotal: $5,000.00\nCorporate Bulk Discount (10%): -$500.00\nDelivery Fee: WAIVED (Orders over $1,000)\nTotal Amount Due: $4,500.00\nPayment Terms: Net 30 days", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["They did not have to pay for shipping.", "They will receive their order by September 20.", "They ordered customized executive desks.", "They must pay the total amount immediately."], "answer": 0, "explanation": "[정답 분석] 'Delivery Fee: WAIVED (Orders over $1,000)'에 따라 1,000달러를 초과하여 배송비를 지불할 필요가 없었으므로 (A)가 정답입니다.", "vocabulary": "delivery fee waived(배송비 면제); net 30 days(30일 이내 결제)"}, {"id": 153, "part": "Part 7", "section": "RC", "category": "Main Idea (채용 공고 대상)", "question": "What position is NovaTech Solutions seeking to fill?", "passage": "JOB OPPORTUNITY: DIRECTOR OF DIGITAL MARKETING\nCompany: NovaTech Solutions\nLocation: Austin, Texas (Hybrid Remote)\n\nNovaTech Solutions, a leading enterprise cloud software provider, is seeking a visionary Director of Digital Marketing to spearhead our international growth initiatives.\n\nKey Responsibilities:\n• Formulate comprehensive multi-channel digital acquisition strategies.\n• Oversee a cross-functional team of 12 specialists in SEO, content, and paid advertising.\n• Manage an annual promotional budget of $3.5 million.\n• Analyze user analytics data and present performance metrics to executive leadership.\n\nQualifications:\n• Bachelor's degree in Marketing, Communications, or related field (MBA preferred).\n• Minimum 7 years of progressive digital marketing experience in B2B technology.\n• Demonstrated track record of scaling SaaS revenue.\n\nBenefits:\n• Competitive base salary with performance bonuses and stock options.\n• 100% employer-sponsored health, dental, and vision insurance.\n• Generous "answer": 0, "explanation": "[정답 분석] 'Minimum 7 years of progressive digital marketing experience'에서 7년 이상의 경력이 요건임을 알 수 있습니다.", "vocabulary": "qualifications(자격 요건); progressive experience(발전적인/점진적인 경력)"}, {"id": 155, "part": "Part 7", "section": "RC", "category": "Detail (지원 마감 방법)", "question": "How should candidates submit their applications?", "passage": "JOB OPPORTUNITY: DIRECTOR OF DIGITAL MARKETING\nCompany: NovaTech Solutions\nLocation: Austin, Texas (Hybrid Remote)\n\nNovaTech Solutions, a leading enterprise cloud software provider, is seeking a visionary Director of Digital Marketing to spearhead our international growth initiatives.\n\nKey Responsibilities:\n• Formulate comprehensive multi-channel digital acquisition strategies.\n• Oversee a cross-functional team of 12 specialists in SEO, content, and paid advertising.\n• Manage an annual promotional budget of $3.5 million.\n• Analyze user analytics data and present performance metrics to executive leadership.\n\nQualifications:\n• Bachelor's degree in Marketing, Communications, or related field (MBA preferred).\n• Minimum 7 years of progressive digital marketing experience in B2B technology.\n• Demonstrated track record of scaling SaaS revenue.\n\nBenefits:\n• Competitive base salary with performance bonuses and stock options.\n• 100% employer-sponsored health, dental, and vision insurance.\n• Generous retirement match (up to 6%).\n\nTo apply, please submit your resume and portfolio to careers@novatech.com by October 31.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["By sending materials by postal mail", "By emailing a resume and portfolio", "By applying in person at the Austin office", "By completing an online assessment test"], "answer": 1, "explanation": "[정답 분석] 'submit your resume and portfolio to careers@novatech.com'에서 이메일 제출임을 알 수 있습니다.", "vocabulary": "submit resume(이력서를 제출하다); employer-sponsored(회사 지원의)"}, {"id": 156, "part": "Part 7", "section": "RC", "category": "Detail (행사 시간)", "question": "What time will the morning coffee service begin?", "passage": "BOOKING CONFIRMATION\n\nGrand Plaza Hotel & Conference Center\nReservation ID: GP-88421\nGuest Name: Arthur Pendelton, Vertex BioSciences\nEvent Date: November 18, 2026\n\nBooking Summary:\n• Meeting Space: The Regent Ballroom (Hall B)\n• Time: 8:00 A.M. – 5:00 P.M.\n• Expected Attendance: 85 attendees\n• Room Setup: Classroom style with center aisle\n• Audiovisual Package: Dual ceiling projectors, wireless microphones, podium with laptop HDMI connection\n\nCatering Details:\n• Morning Coffee Service (8:30 A.M.): Freshly brewed coffee, herbal teas, fruit pastries\n• Executive Buffet Lunch (12:30 P.M.): Grilled salmon, vegetarian lasagna, mixed garden salads\n\nPayment Status:\nA 20% non-refundable deposit of $600.00 was charged to your credit card ending in 4019. The remaining balance of $2,400.00 will be due upon check-in on the morning of the event.\n\nCancellation Policy:\nCancellations made less than 7 business days prior to the event will be billed for 50% of the total event cost.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["8:00 A.M.", "8:30 A.M.", "12:30 P.M.", "5:00 P.M."], "answer": 1, "explanation": "[정답 분석] 'Morning Coffee Service (8:30 A.M.)'이라고 명시되어 있습니다.", "vocabulary": "reservation(예약); freshly brewed(신선하게 내린)"}, {"id": 157, "part": "Part 7", "section": "RC", "category": "Financial Detail (잔금 결제 시점)", "question": "When must the remaining balance of $2,400.00 be paid?", "passage": "BOOKING CONFIRMATION\n\nGrand Plaza Hotel & Conference Center\nReservation ID: GP-88421\nGuest Name: Arthur Pendelton, Vertex BioSciences\nEvent Date: November 18, 2026\n\nBooking Summary:\n• Meeting Space: The Regent Ballroom (Hall B)\n• Time: 8:00 A.M. – 5:00 P.M.\n• Expected Attendance: 85 attendees\n• Room Setup: Classroom style with center aisle\n• Audiovisual Package: Dual ceiling projectors, wireless microphones, podium with laptop HDMI connection\n\nCatering Details:\n• Morning Coffee Service (8:30 A.M.): Freshly brewed coffee, herbal teas, fruit pastries\n• Executive Buffet Lunch (12:30 P.M.): Grilled salmon, vegetarian lasagna, mixed garden salads\n\nPayment Status:\nA 20% non-refundable deposit of $600.00 was charged to your credit card ending in 4019. The remaining balance of $2,400.00 will be due upon check-in on the morning of the event.\n\nCancellation Policy:\nCancellations made less than 7 business days prior to the event will be billed for 50% of the total event cost.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Immediately upon receiving the confirmation", "Seven business days prior to the event", "Upon check-in on the morning of the event", "Within 30 days after the event concludes"], "answer": 2, "explanation": "[정답 분석] 'The remaining balance of $2,400.00 will be due upon check-in on the morning of the event'라고 밝혔습니다.", "vocabulary": "remaining balance(잔액); non-refundable deposit(환불 불가 계약금)"}, {"id": 158, "part": "Part 7", "section": "RC", "category": "Main Purpose (문서 목적)", "question": "What is the main purpose of the document?", "passage": "LUMINA AUDIO SYSTEMS: LIMITED ONE-YEAR WARRANTY\n\nLumina Audio warrants all consumer electronics against manufacturer defects in materials and craftsmanship for a period of one (1) year from the original retail purchase date.\n\nWarranty Coverage:\nThis warranty covers free replacement of malfunctioning hardware components, factory software recalibration, and return shipping costs within the continental United States.\n\nExclusions:\nThis warranty does not cover:\n1. Cosmetic damage resulting from normal wear and tear, including scratches and dents.\n2. Damage caused by unauthorized repairs, water submersion, or drops onto hard surfaces.\n3. Consumable parts such as charging cables and ear tips after 90 days from purchase.\n\nHow to Obtain Warranty Service:\n1. Visit www.luminaaudio.com/support and submit a Warranty Service Claim.\n2. Provide your serial number, proof of purchase (sales receipt), and a brief description of the defect.\n3. Upon approval, you will receive a prepaid shipping label via email. Pack the item securely and ship it to our regional repair depot in Chicago.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["To outline warranty terms and repair procedures", "To announce a product recall for safety reasons", "To promote an extended warranty subscription", "To provide instructions on device pairing"], "answer": 0, "explanation": "[정답 분석] 보증 기간, 적용 대상, 제외 항목, 서비스 신청 절차를 설명하고 있으므로 보증 규정 및 수리 절차 안내인 (A)가 정답입니다.", "vocabulary": "warranty coverage(보증 범위); manufacturer defect(제조 결함)"}, {"id": 159, "part": "Part 7", "section": "RC", "category": "Detail (보증 제외 항목)", "question": "According to the policy, what is NOT covered by the warranty?", "passage": "LUMINA AUDIO SYSTEMS: LIMITED ONE-YEAR WARRANTY\n\nLumina Audio warrants all consumer electronics against manufacturer defects in materials and craftsmanship for a period of one (1) year from the original retail purchase date.\n\nWarranty Coverage:\nThis warranty covers free replacement of malfunctioning hardware components, factory software recalibration, and return shipping costs within the continental United States.\n\nExclusions:\nThis warranty does not cover:\n1. Cosmetic damage resulting from normal wear and tear, including scratches and dents.\n2. Damage caused by unauthorized repairs, water submersion, or drops onto hard surfaces.\n3. Consumable parts such as charging cables and ear tips after 90 days from purchase.\n\nHow to Obtain Warranty Service:\n1. Visit www.luminaaudio.com/support and submit a Warranty Service Claim.\n2. Provide your serial number, proof of purchase (sales receipt), and a brief description of the defect.\n3. Upon approval, you will receive a prepaid shipping label via email. Pack the item securely and ship it to our regional repair depot in Chicago.", "imageUrl": null, "imageSvg": n ping label(선불 배송 라벨); regional repair depot(지역 수리 센터)"}, {"id": 161, "part": "Part 7", "section": "RC", "category": "Main Idea (기사 주요 내용)", "question": "What is the article mainly about?", "passage": "AUSTIN BUSINESS CHRONICLE\nCleanVolt Secures $45 Million in Series B Funding to Expand Battery Storage Production\nBy Daniel Gallagher\n\nAUSTIN — CleanVolt Energy, a promising green technology startup founded in 2022, announced on Tuesday that it has finalized a $45 million Series B financing round led by Horizon Ventures, with additional participation from Texas Green Capital.\n\nThe capital injection will primarily finance the construction of CleanVolt's second manufacturing gigafactory in Round Rock, Texas. The new 180,000-square-foot facility is projected to triple the company's production capacity for commercial grid battery storage systems by late 2027.\n\n\"Commercial demand for reliable, large-scale battery storage has surged dramatically as corporations transition toward renewable solar and wind energy,\" stated CleanVolt founder and CEO Dr. Maya Patel. \"This investment accelerates our mission to provide scalable, zero-emission energy storage.\"\n\nIn addition to expanding production, CleanVolt plans to hire approximately 160 engineers, technicians, and assembly specialists over the next eighteen months. The Round Rock municipal council has granted the company a ten-year property tax abatement in exchange for the local job creation commitment.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["A corporate bankruptcy filing", "A successful funding round for a clean energy company", "A merger between two automotive manufacturers", "A city council election in Round Rock"], "answer": 1, "explanation": "[정답 분석] CleanVolt라는 친환경 배터리 스타트업이 4,500만 달러 규모의 투자를 유치했다는 기사입니다.", "vocabulary": "secure funding(자금을 확보하다); clean energy(청정 에너지)"}, {"id": 162, "part": "Part 7", "section": "RC", "category": "Detail (투자금 사용처)", "question": "How will CleanVolt n\nJason Miller [2:17 P.M.]:\nWe ran tests all morning. The database handled 50,000 simulated concurrent users without latency spikes. However, the automated payment gateway threw intermittent timeout errors during checkout simulations.\n\nEvelyn Wong [2:18 P.M.]:\nThat's unacceptable for launch. We can't have customers experiencing transaction errors. Sarah, can your development team patch that API integration before 5:00 P.M. today?\n\nSarah Jenkins [2:20 P.M.]:\nThe issue stems from a third-party token verification delay. My team is writing an asynchronous retry handler right now. We expect to push the hotfix to the staging environment by 4:15 P.M.\n\nJason Miller [2:22 P.M.]:\nGreat. Once Sarah pushes the fix, QA will re-run the stress test overnight.\n\nEvelyn Wong [2:23 P.M.]:\nPerfect. Let's reconvene on Zoom tomorrow at 9:00 A.M. to review the overnight results.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Office supply restocking", "Software beta testing and launch readiness", "Annual employee performance evaluations", "A budget allocation dispute"], "answer": 1, "explanation": "[정답 분석] 소프트웨어 베타 론칭을 앞두고 부하 테스트 결과 및 결제 게이트웨이 오류 수정을 논의하고 있습니다.", "vocabulary": "beta launch(베타 출시); load testing(부하 테스트); readiness(준비 상태)"}, {"id": 165, "part": "Part 7", "section": "RC", "category": "Problem (발생한 결함)", "question": "What issue did Jason Miller report?", "passage": "PROJECT ALPHA ONLINE CHAT\n\nEvelyn Wong [2:15 P.M.]:\nTeam, we need to finalize the schedule for next week's software beta launch. Has QA completed the load testing on server cluster 3?\n\nJason Miller [2:17 P.M.]:\nWe ran tests all morning. The database handled 50,000 simulated concurrent users without latency spikes. However, the automated payment gateway threw intermittent timeout errors during checkout simulations.\n\nEvelyn Wong [2:18 P.M.]:\nThat's unacceptable for launch. We can't have customers experiencing transaction errors. Sarah, can your development team patch that API integration before 5:00 P.M. today?\n\nSarah Jenkins [2:20 P.M.]:\nThe issue stems from a third-party token verification delay. My team is writing an asynchronous retry handler right now. We expect to push the hotfix to the staging environment by 4:15 P.M.\n\nJason Miller [2:22 P.M.]:\nGreat. Once Sarah pushes the fix, QA will re-run the stress test overnight.\n\nEvelyn Wong [2:23 P.M.]:\nPerfect. Let's reconvene on Zoom tomorrow at 9:00 A.M. to review the overnight results.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["The servers completely crashed.", "Payment timeout errors occurred during checkout.", "Customer passwords were leaked.", "The network cable was unplugged."], "answer": 1, "explanation": "[정답 분석] 'automated payment gateway threw intermittent timeout errors during checkout'라고 문제를 보고했습니다.", "vocabulary": "payment gateway(결제 게이트웨이); timeout error(시간 초과 오류)"}, {"id": 166, "part": "Part 7", "section": "RC", "category": "Detail (Sarah의 작업 일정)", "question": "When does Sarah Jenkins expect to deploy the hotfix?", "passage": "PROJECT ALPHA ONLINE CHAT\n\nEvelyn Wong [2:15 P.M.]:\nTeam, we need to finalize the schedule for next week's software beta launch. Has QA completed the load testing on server cluster 3?\n\nJason Miller [2:17 P.M.]:\nWe ran tests all morning. The database handled 50,000 simulated concurrent users without latency spikes. However, the automated payment gateway threw intermittent timeout errors during checkout simulations.\n\nEvelyn Wong [2:18 P.M.]:\nThat's unacceptable for launch. We can't have customers experiencing transaction errors. Sarah, can your development team patch that API integration before 5:00 P.M. today?\n\nSarah Jenkins [2:20 P.M.]:\nThe issue stems from a third-party token verification delay. My team is writing an asynchronous retry handler right now. We expect to push the hotfix to the staging environment by 4:15 P.M.\n\nJason Miller [2:22 P.M.]:\nGreat. Once Sarah pushes the fix, QA will oom tomorrow at 9:00 A.M. to review the overnight results'라고 회의를 소집했습니다.", "vocabulary": "reconvene(다시 모이다); overnight results(밤샘 테스트 결과)"}, {"id": 168, "part": "Part 7", "section": "RC", "category": "Main Topic (뉴스레터 기사 주제)", "question": "Why is the Denver branch featured in the newsletter?", "passage": "THE PINNACLE DISPATCH — INTERNAL STAFF NEWSLETTER\nIssue 44 | November Edition\n\nBRANCH OF THE QUARTER: DENVER TECH SERVICES\n\nPinnacle Global is proud to recognize our Denver regional office as Branch of the Quarter! Under the inspirational leadership of Branch General Manager Patrick Vance, the Denver team surpassed its annual client acquisition target three months ahead of schedule.\n\nA Culture of Innovation:\nEarlier this year, the Denver office piloted an innovative client onboarding protocol called 'ExpressDeploy.' By streamlining network hardware setup and providing customized video tutorials, the branch reduced average client deployment time from 14 days to just 5 days. Client satisfaction ratings subsequently skyrocketed to an industry-leading 98.4%.\n\nCommunity Commitment:\nBeyond commercial success, the Denver team demonstrated outstanding civic responsibility. Over the summer, employees collectively volunteered more than 300 hours at the Mile High Youth STEM Academy, mentoring high school students in computer coding and robotics.\n\nCelebration Event:\nIn honor of their remarkable achievements, executive leadership will host an appreciation luncheon for all Denver staff at the Grand View Ballroom on Friday, November 21. Each employee will also receive a commemorative plaque and an additional day of paid personal leave.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["It is moving to a new office building.", "It was selected as Branch of the Quarter.", "It recently hired a new general manager.", "It resolved a major corporate lawsuit."], "answer": 1, "explanation": "[정답 분석] 'Pinnacle Global is proud to recognize our Denver regional office as Branch of the Quarter!'라고 명시되어 있습니다.", "vocabulary": "branch of the quarter(분기 최우수 지사); surpass target(목표를 능가하다)"}, {"id": 169, "part": "Part 7", "section": "RC", "category": "Detail (ExpressDeploy 도입 효과)", "question": "What was an outcome of the 'ExpressDeploy' protocol?", "passage": "THE PINNACLE DISPATCH — INTERNAL STAFF NEWSLETTER\nIssue 44 | November Edition\n\nBRANCH OF THE QUARTER: DENVER TECH SERVICES\n\nPinnacle Global is proud to recognize our Denver regional office as Branch of the Quarter! Under the inspirational leadership of Branch General Manager Patrick Vance, the Denver team surpassed its annual client acquisition target three months ahead of schedule.\n\nA Culture of Innovation:\nEarlier this year, the Denver office piloted an innovative client onboarding protocol called 'ExpressDeploy.' By streamlining network hardware setup and providing customized video tutorials, the branch reduced average client deployment time from 14 days to just 5 days. Client satisfaction ratings subsequently skyrocketed to an industry-leading 98.4%.\n\nCommunity Commitment:\nBeyond commercial success, the Denver team demonstrated outstanding civic responsibility. Over the summer, employees collectively volunteered more than 300 hours at the Mile High Youth STEM Academy, mentoring high school students in computer coding and robotics.\n\nCelebration Event:\nIn honor of their remarkable achievements, executive leadership will host an appreciation luncheon for all Denver staff at the Grand View Ballroom on Friday, November 21. Each employee will also receive a commemorative plaque and an additional day of paid personal leave.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Employee turnover decreased by half.", "Client deployment time was reduced from 14 to 5 days.", "Office electricity costs were cut by 30%.", "Hardware manufacturing was moved overseas."], "answer": 1, "explanation": "[정답 분석] 'reduced average client deployment time from 14 days to just 5 days'라고 명시되어 있습니다.", "vocabulary": "deployment time(도입/설치 소요 시간); streamline(간소화/효율화하다)"}, {"id": 170, "part": "Part 7", "section": "RC", "category": "Detail (지역사회 공헌 활동)", "question": "What community volunteer work did Denver employees perform?", "passage": "THE PINNACLE DISPATCH — INTERNAL STAFF NEWSLETTER\nIssue 44 | November Edition\n\nBRANCH OF THE QUARTER: DENVER TECH SERVICES\n\nPinnacle Global is proud to recognize our Denver regional office as Branch of the Quarter! Under the inspirational leadership of Branch General Manager Patrick Vance, the Denver team surpassed its annual client acquisition target three months ahead of schedule.\n\nA Culture of Innovation:\nEarlier this year, the Denver office piloted an innovative client onboarding protocol called 'ExpressDeploy.' By streamlining network hardware setup and providing customized video tutorials, the branch reduced average client deployment time from 14 days to just 5 days. Client satisfaction ratings subsequently skyrocketed to an industry-leading 98.4%.\n\nCommunity Commitment:\nBeyond commercial success, the Denver team demonstrated outstanding civic responsibility. Over the summer, employees collectively volunteered more than 300 hours at the Mile High Youth STEM Academy, mentoring high school students in computer coding and robotics.\n\nCelebration Event:\nIn honor of their remarkable achievements, executive leadership will host an appreciation luncheon for all Denver staff at the Grand View Ballroom on Friday, November 21. Each employee will also receive a commemorative plaque and an additional day of paid personal leave.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Serving meals at an animal shelter", "Mentoring high school students in coding and robotics", "Planting trees in national parks", "Organizing a charity golf tournament"], "answer": 1, "explanation": "[정답 분석] 'mentoring high school students in computer coding and robotics'라고 밝혔습니다.", "vocabulary": "civic responsibility(시민적 책임); volunteer(봉사하다)"}, {"id": 171, "part": "Part 7", "section": "RC", "category": "Detail (직원 포상 내역)", "question": "What reward will Denver staff members receive?", "passage": "THE PINNACLE DISPATCH — INTERNAL STAFF NEWSLETTER\nIssue 44 | November Edition\n\nBRANCH OF THE QUARTER: DENVER TECH SERVICES\n\nPinnacle Global is proud to recognize our Denver regional office as Branch of the Quarter! Under the inspirational leadership of Branch General Manager Patrick Vance, the Denver team surpassed its annual client acquisition target three months ahead of schedule.\n\nA Culture of Innovation:\nEarlier this year, the Denver office piloted an innovative client onboarding protocol called 'ExpressDeploy.' By streamlining network hardware setup and providing customized video tutorials, the branch reduced average client deployment time from 14 days to just 5 days. Client satisfaction ratings subsequently skyrocketed to an industry-leading 98.4%.\n\nCommunity Commitment:\nBeyond commercial success, the Denver team demonstrated outstanding civic responsibility. Over the summer, employees collectively volunteered more than 300 hours at the Mile High Youth STEM Academy, mentoring high school students in computer coding and robotics.\n\nCelebration Event:\nIn honor of their remarkable achievements, executive leadership will host an appreciation luncheon for all Denver staff at the Grand View Ballroom on Friday, November 21. Each employee will also receive a commemorative plaque and an additional day of paid personal leave.", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["An airline travel voucher", "A commemorative plaque and a paid day off", "A free laptop computer", "Stock shares in the company"], "answer": 1, "explanation": "[정답 분석] 'Each employee will also receive a commemorative plaque and an additional day of paid personal leave'라고 보상 내용을 밝혔습니다.", "vocabulary": "commemorative plaque(기념패); paid personal leave(유급 개인 휴가)"} .", "vocabulary": "adaptive reuse(용도 변경/재활용); architectural heritage(건축 유산)"}, {"id": 176, "part": "Part 7", "section": "RC", "category": "Purpose (문서 1 목적)", "question": "What is the main purpose of Rachel Vance's email?", "passage": "[DOCUMENT 1: EMAIL]\nTo: events@savoryfeasts.com\nFrom: r.vance@vancetech.com\nDate: October 12\nSubject: Catering Inquiry for Annual Client Gala\n\nDear Savory Feasts Team,\n\nI am writing on behalf of Vance Technologies to request a catering proposal for our annual corporate client appreciation gala scheduled for Thursday, November 19. We anticipate approximately 120 guests attending the event at the Harborside Pavilion in Baltimore.\n\nThe reception will run from 6:30 P.M. to 9:30 P.M. We are interested in a hot and cold hors d'oeuvres service for the first hour, followed by a formal seated dinner. Several of our key executives require strictly gluten-free and vegetarian options. Additionally, we will need full bartending service including local craft beers and wine.\n\nPlease provide an itemized quote along with staffing and linen rental estimates at your earliest convenience.\n\nSincerely,\nRachel Vance, VP of Corporate Relations, Vance Technologies\n\n--------------------------------------------------------------------------------\n[DOCUMENT 2: CATERING QUOTATION]\nSAVORY FEASTS CATERING & EVENT DESIGN\nQuotation #SF-7740 | Prepared For: Rachel Vance, Vance Technologies\nEvent Date: November 19 | Guest Count: 120\n\nPackage Selected: Executive Diamond Banquet Package\n• Hors d'oeuvres (6:30 P.M. – 7:30 P.M.): Mini crab cakes, wild mushroom crostini, smoked duck skewers\n• Entrée Selections:\n  - Option A: Herb-crusted beef tenderloin with rosemary potatoes ($45/person)\n  - Option B: Pan-seared sea bass with saffron risotto ($42/person)\n  - Option C: Roasted butternut squash risotto with grilled asparagus (Vegetarian/Gluten-Free, $36/person)\n• Beverage & Bar Service: Premium 3-hour open bar ($22/person)\n• Service Personnel: 1 • Collaborate with multimedia producers to develop accompanying podcasts and video mini-documentaries.\n\nRequirements:\n• Bachelor's or Master's degree in Journalism, English, or Political Science.\n• Minimum 5 years of professional reporting experience at a metropolitan daily newspaper or national magazine.\n• Demonstrable portfolio of published long-form investigative articles.\n• Familiarity with data analysis tools (SQL or advanced Excel) is highly advantageous.\n\nTo apply: Email cover letter, resume, and three writing samples to recruitment@harborlightmedia.com.\n\n--------------------------------------------------------------------------------\n[DOCUMENT 2: COVER LETTER EMAIL]\nTo: recruitment@harborlightmedia.com\nFrom: simon.bradley@journomail.com\nDate: November 4\nSubject: Application for Senior Investigative Journalist — Simon Bradley\n\nDear Hiring Committee,\n\nI am writing to express my enthusiastic interest in the Senior Investigative Journalist opening at Harbor Light Media. With seven years of investigative reporting at the Chicago Herald and two national journalism excellence awards, I am confident in my ability to make an immediate impact on your newsroom.\n\nDuring my tenure at the Herald, I led a four-part investigative series exposing illegal chemical runoff into the Great Lakes, which prompted state legislative hearings and corporate remediation. Furthermore, I routinely utilized advanced Excel and SQL database queries to uncover undisclosed campaign contributions.\n\nI have attached my resume, three investigative feature clips, and letters of recommendation from my former editors. I look forward to the possibility of discussing how my reporting expertise aligns with Harbor Light Media's editorial mission.\n\nSincerely,\nSimon Bradley", "imageUrl": null, "imageSvg": null, "audioScript": null, "options": ["Multimedia Producer", "Senior Investigative Journalist", "Advertising Sales Director", "Podcast Sound Engineer"], "answer": 1, "explanatio     // ETS 공식 챠임벨 (띵동~ 실전 시작음)
    function playETSChime() {
      return new Promise((resolve) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.7);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.00, now + 0.18);
          gain2.gain.setValueAtTime(0.25, now + 0.18);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.18);
          osc2.stop(now + 1.1);

          setTimeout(resolve, 800);
        } catch (e) {
          resolve();
        }
      });
    }

    function speakPromise(text, rate = 1.0, isFemale = true) {
      return new Promise((resolve) => {
        if (!window.speechSynthesis) return resolve();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;

        const voices = window.speechSynthesis.getVoices();
        const usVoices = voices.filter(v => v.lang.startsWith('en'));
        if (usVoices.length > 0) {
          if (isFemale) {
            const fVoice = usVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('jenny'));
            if (fVoice) u.voice = fVoice;
          } else {
            const mVoice = usVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('guy'));
            if (mVoice) u.voice = mVoice;
            else u.pitch = 0.85;
          }
        }

        u.onend = () => resolve();
        u.onerror = () => resolve();
        window.speechSynthesis.speak(u);
      });
    }

          if (!audioSequenceActive) return;

          status.innerText = `🔊 (${labels[i]}) ${q.options[i]}`;
          await speakPromise(`(${labels[i]}) ${q.options[i]}`, speed, (i % 2 === 0));
          if (!audioSequenceActive) return;
        }

      } else if (q.part === 'Part 2') {
        status.innerText = `🔊 Number ${q.id}. ${q.question}`;
        const qClean = q.audioScript.split('?')[0].replace(/Number\s*\d+\.\s*/i, '').trim() + '?';
        await speakPromise(`Number ${q.id}. ${qClean}`, speed, false);
        if (!audioSequenceActive) return;

        const labels = ['A', 'B', 'C'];
        for (let i = 0; i < 3; i++) {
          status.innerText = `⏳ Option (${labels[i]}) 준비 중...`;
          await sleep(2000 / speed);
          if (!audioSequenceActive) return;

          status.innerText = `🔊 ${q.options[i]}`;
          await speakPromise(q.options[i], speed, true);
          if (!audioSequenceActive) return;
        }

      } else if (q.part === 'Part 3' || q.part === 'Part 4') {
        status.innerText = '🔊 원어민 실전 대화 청취 중...';
        const lines = q.audioScript.split('\n');
        for (let line of lines) {
          const isFemale = line.toLowerCase().startsWith('woman:');
          const cleanLine = line.replace(/^(man|woman|questions?\s*\d+.*?):\s*/i, '').trim();
          if (cleanLine) {
            status.innerText = `🔊 ${line.split(':')[0]}: ${cleanLine.substring(0, 35)}...`;
            await speakPromise(cleanLine, speed, isFemale);
            await sleep(600 / speed);
            if (!audioSequenceActive) return;
          }
        }
        status.innerText = `🔊 Question ${q.id}. ${q.question}`;
        await sleep(1500 / speed);
        await speakPromise(`Question ${q.id}. ${q.question}`, speed, true);
      }

      isPlaying = false;
      audioSequenceActive = false;
      if (status) status.innerText = '✅ 듣기 평가 종료! 정답을 선택하세요.';
      if (pIcon) pIcon.innerText = '▶';
      if (pText) pText.innerText = '다시 듣기';
    }

    function stopAudio() {
      audioSequenceActive = false;
      if (audioTimeoutId) clearTimeout(audioTimeoutId);
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      isPlaying = false;
      const status = document.getElementById('audioStatus');
      if (status) status.innerText = '대기 중 (재생 버튼을 누르세요)';
      const pIcon = document.getElementById('playIcon');
      if (pIcon) pIcon.innerText = '▶';
      const pText = document.getElementById('playText');
      if (pText) pText.innerText = '실전 원어민 듣기 재생';
    }

    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '4') {
          selectOption(parseInt(e.key) - 1);
        } else if (e.key === 'ArrowRight') {
          changeQuestion(1);
        } else if (e.key === 'ArrowLeft') {
          changeQuestion(-1);
        }
      });
    }

    
    function showToeicHandbook() {
      stopAudio();
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      const hBtn = document.getElementById('btnTabHandbook');
      if (hBtn) hBtn.classList.add('active');

      document.getElementById('quizMainCard').style.display = 'none';
      const side = document.querySelector('.sidebar');
      if (side) side.style.display = 'none';

      const hb = document.getElementById('toeicHandbookContainer');
      hb.style.display = 'block';

      let html = `
        <div style="background:#EFF6FF; border:1.5px solid #93C5FD; border-radius:10px; padding:16px 20px; margin-bottom:20px;">
          <h2 style="color:#1E40AF; font-size:1.15rem; margin-bottom:6px;">📖 토익 800+ 엑셀 정답 및 상세 해설집 (전체 200문항 연동)</h2>
          <p style="font-size:0.9rem; color:#3B82F6;">엑셀을 따로 열지 않아도 음성 스크립트, 우리말 전문 번역, 1초 문법 분석, 오답 함정 피하기 팁을 여기서 즉시 확인하실 수 있습니다.</p>
        </div>
      `;

      questions.forEach((q, idx) => {
        const isLC = (q.section === 'LC');
        const badgeCls = isLC ? 'th-badge-lc' : 'th-badge-rc';
        const letters = ['A', 'B', 'C', 'D'];
        const ansLetter = letters[q.answer] || q.answer;

        html += `
          <div class="toeic-handbook-card">
            <div class="th-header">
              <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span class="${badgeCls}">${q.part}</span>
                <strong style="font-size:1.1rem; color:#0F172A;">[Q${q.id}] ${q.category}</strong>
                <span style="font-size:0.85rem; color:#64748B;">정답: <strong>(${ansLetter})</strong></span>
              </div>
              <button class="th-btn-jump" onclick="jumpToSolve(${idx})">이 문제 바로 풀기 🎯</button>
            </div>

            <div style="font-size:0.98rem; font-weight:700; color:#1E293B; margin-bottom:12px;">
              ${q.question}
            </div>

            ${q.passage && q.passage !== 'N/A' ? `
              <div style="background:#F8FAFC; border-left:4px solid #1D5B41; padding:12px 14px; border-radius:0 6px 6px 0; margin-bottom:12px; font-size:0.9rem; line-height:1.6; white-space:pre-line;">
                ${q.passage}
              </div>
            ` : ''}

            ${q.audioScript ? `
              <div style="background:#F0F7FF; border:1px dashed #93C5FD; border-radius:6px; padding:12px; margin-bottom:12px; font-size:0.88rem; line-height:1.6;">
                <strong style="color:#1E40AF;">🎧 음성 스크립트 (Listening Script):</strong><br>
                ${q.audioScript.replace(/<[^>]*>?/gm, ' ')}
              </div>
            ` : ''}

            <div style="background:#F0FDF4; border:1.5px solid #86EFAC; border-radius:6px; padding:12px; margin-bottom:12px;">
              <strong style="color:#166534; font-size:0.9rem;">📝 정답 도출 근거 및 상세 분석:</strong>
              <div style="font-size:0.9rem; color:#14532D; margin-top:4px; line-height:1.6;">
                ${q.explanation}
              </div>
            </div>

            ${q.vocabulary ? `
              <div style="background:#FAF5FF; border-left:4px solid #9333EA; padding:10px 14px; border-radius:0 6px 6px 0; font-size:0.88rem; color:#581C87;">
                <strong>🔍 핵심 필수 어휘 & 표현:</strong> ${q.vocabulary}
              </div>
            ` : ''}
          </div>
        `;
      });

      hb.innerHTML = html;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToSolve(idx) {
      document.getElementById('toeicHandbookContainer').style.display = 'none';
      document.getElementById('quizMainCard').style.display = '';
      const side = document.querySelector('.sidebar');
      if (side) side.style.display = '';

      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      const allBtn = document.getElementById('btnTabAll');
      if (allBtn) allBtn.classList.add('active');

      filteredQuestions = [...questions];
      currentIdx = idx;
      renderOMR();
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = init;
  </script>
</body>
</html>
