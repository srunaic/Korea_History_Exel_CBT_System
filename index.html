<script>
// ==========================================
// [싱글 탭(One-Tab) 스마트 동기화 & 새창 자동 방지 시스템]
function getTargetQFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const qParam = params.get('q');
  if (qParam) return parseInt(qParam, 10);
  const hash = window.location.hash;
  if (hash && hash.startsWith('#q')) {
    return parseInt(hash.replace('#q', ''), 10);
  }
  return null;
}

const cbtChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('cbt_one_tab_sync') : null;
const targetQFromUrl = getTargetQFromUrl();

let isMasterTab = false;

// 1. 이미 열려 있는 기존 마스터 창이 있는지 확인 요청
if (cbtChannel) {
  cbtChannel.postMessage({ type: 'CHECK_MASTER', q: targetQFromUrl });

  cbtChannel.onmessage = function(event) {
    if (!event.data) return;

    if (isMasterTab && event.data.type === 'CHECK_MASTER') {
      const newQ = event.data.q;
      if (typeof rawData !== 'undefined') {
        const newIdx = rawData.findIndex(item => item.id === newQ);
        if (newIdx !== -1) {
          currentQIndex = newIdx;
          renderCurrentQuestion();
          highlightGrid();
          window.focus();
        }
      }
      cbtChannel.postMessage({ type: 'MASTER_UPDATED', q: newQ });
    } else if (!isMasterTab && event.data.type === 'MASTER_UPDATED') {
      closeThisTabImmediately(event.data.q);
    }
  };
}

// 탭 자동 닫기 함수 (Chromium 닫기 방어막 우회 트릭)
function closeThisTabImmediately(qNum) {
  try {
    // 1차 시도: 표준 close
    window.close();
    // 2차 시도: Chromium self open 우회 해킹
    window.open('', '_self', '');
    window.close();
  } catch(e) {}

  // 만약 브라우저 설정으로 강제 닫기가 막힌 경우: 사용자에게 친절 안내 & 버튼 제공
  document.body.innerHTML = `
    <div style="font-family:sans-serif; text-align:center; padding-top:80px; background:#F0F4F8; min-height:100vh;">
      <div style="max-width:480px; margin:0 auto; background:white; padding:36px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.08);">
        <div style="font-size:44px; margin-bottom:12px;">✅</div>
        <h2 style="color:#1F4E79; font-size:22px; margin-bottom:8px;">기존 실행 창에서 [Q${qNum}번]으로 변경 완료!</h2>
        <p style="color:#64748B; font-size:14px; margin-bottom:24px; line-height:1.6;">
          기존에 열려 있던 CBT 창의 문제가 <b>Q${qNum}번</b>으로 즉시 업데이트되었습니다.<br>
          (이 탭은 닫으셔도 됩니다.)
        </p>
        <button onclick="window.close()" style="background:#1F4E79; color:white; border:none; padding:12px 28px; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer;">이 탭 닫기</button>
      </div>
    </div>
  `;
}

// 0.25초 동안 기존 창의 응답이 없으면 내가 최초의 마스터 창이 됨
setTimeout(() => {
  isMasterTab = true;
}, 250);

// ==========================================
// [키보드 단축키]: 좌우 방향키로 이전/다음, 1~4번 답 선택
// ==========================================
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') navQuestion(-1);
  if (e.key === 'ArrowRight') navQuestion(1);
  if (['1', '2', '3', '4'].includes(e.key)) {
    const idx = parseInt(e.key) - 1;
    const btns = document.querySelectorAll('.choices-list .choice-btn');
    if (btns && btns[idx]) btns[idx].click();
  }
});

// [Security & Anti-Theft Protection]
document.addEventListener('contextmenu', e => e.preventDefault(), {capture: true});
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.keyCode === 83 || (e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67))))){
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, {capture: true});
document.addEventListener('copy', e => {
  if (window.getSelection && window.getSelection().toString().length > 0) {
    e.preventDefault();

// URL 해시(#q14) 또는 쿼리(?q=14) 감지 함수
function getTargetQFromUrl() {
  // 1. Hash 감지 (#q14)
  const hash = window.location.hash;
  if (hash) {
    const match = hash.match(/#q?(\d+)/i);
    if (match) return parseInt(match[1], 10);
  }
  // 2. Search Params 감지 (?q=14)
  const params = new URLSearchParams(window.location.search);
  const qParam = params.get('q');
  if (qParam) return parseInt(qParam, 10);
  
  return 1; // 기본 1번
}

    alert('풀이 기록이 초기화되었습니다. 1번 문제부터 다시 시작합니다.');
  }
}

function initApp() {
  // 1. 세션 복원 (localStorage)
  try {
    const savedAns = localStorage.getItem('kh_cbt_answers');
    if (savedAns) {
      userAnswers = JSON.parse(savedAns) || {};
    }
  } catch (e) {
    console.error('LocalStorage load error:', e);
  }

  const targetId = getTargetQFromUrl();
  let foundIdx = -1;
  if (window.location.hash || window.location.search) {
    foundIdx = rawData.findIndex(item => item.id === targetId);
  } else {
    try {
      const savedIdx = localStorage.getItem('kh_cbt_current_idx');
      if (savedIdx !== null) {
        const pIdx = parseInt(savedIdx, 10);
        if (!isNaN(pIdx) && pIdx >= 0 && pIdx < rawData.length) {
          foundIdx = pIdx;
        }
      }
    } catch(e) {}
    if (foundIdx === -1) {
      foundIdx = rawData.findIndex(item => item.id === targetId);
    }
  }
  currentQIndex = foundIdx !== -1 ? foundIdx : 0;

  buildNumGrid();
  renderCurrentQuestion();
  renderAllQuestions();
  updateOMRStats();

  // 해시 변경 감지 (뒤로가기/앞으로가기 또는 링크 클릭)
  window.addEventListener('hashchange', () => {
    const newTargetId = getTargetQFromUrl();
    const newIdx = rawData.findIndex(item => item.id === newTargetId);
    if (newIdx !== -1) {
      currentQIndex = newIdx;
      saveKhProgress();
      renderCurrentQuestion();
      highlightGrid();
      if (currentMode === 'all') {
        const el = document.getElementById('card_q' + newTargetId);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    }
  });
}

function buildNumGrid() {
  const grid = document.getElementById('numGrid');
  grid.innerHTML = '';
  const filter = document.getElementById('eraFilterSelect').value;

  rawData.forEach((item, idx) => {
    const isKiller = item.diff.includes('킬러') || item.era.includes('문화재') || item.era.includes('지역사') || item.era.includes('순서') || item.era.includes('문화유산') || item.era.includes('통합');
    if (filter === '킬러' && !isKiller) return;
    if (filter !== '전체' && filter !== '킬러' && !item.era.includes(filter)) return;

    const btn = document.createElement('button');
    btn.className = 'grid-btn' + (isKiller ? ' killer-item' : '');
    btn.id = 'gridBtn_' + item.id;
    btn.innerText = 'Q' + item.id;
    btn.onclick = () => goToQuestion(idx);
    grid.appendChild(btn);
  });
  highlightGrid();
}

function highlightGrid() {
  const curItem = rawData[currentQIndex];
  document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('current'));
  const curBtn = document.getElementById('gridBtn_' + curItem.id);
  if (curBtn) curBtn.classList.add('current');

  // 답안 상태 색상 표시
  Object.keys(userAnswers).forEach(qId => {
    const b = document.getElementById('gridBtn_' + qId);
    if (b) {
      if (userAnswers[qId].isCorrect) {
        b.classList.remove('answered-wrong');
        b.classList.add('answered-correct');
      } else {
        b.classList.remove('answered-correct');
        b.classList.add('answered-wrong');
      }
    }
  });
}

function filterGridByEra() {
  buildNumGrid();
}

function getOptionsForItem(item) {
  const otherChoices = rawData
    .filter(q => q.id !== item.id && q.correct !== item.correct)
    .map(q => q.correct);

  const distinctWrongs = [];
  let step = 1;
  while (distinctWrongs.length < 3 && step < otherChoices.length) {
    const candidateIdx = (item.id * 7 + step * 13) % otherChoices.length;
    const candidate = otherChoices[candidateIdx];
    if (!distinctWrongs.includes(candidate) && candidate !== item.correct) {
      distinctWrongs.push(candidate);
    }
    step++;
  }

  const options = [
    { text: item.correct, isCorrect: true },
    { text: distinctWrongs[0] || '균역법을 시행하여 군포를 1필로 감면하였다.', isCorrect: false },
    { text: distinctWrongs[1] || '과거제를 시행하여 쌍기의 건의를 수용하였다.', isCorrect: false },
    { text: distinctWrongs[2] || '대동법을 실시하여 공납의 폐단을 시정하였다.', isCorrect: false }
  ];

  // Deterministic shuffle
  const seed = (item.id * 17) % 4;
  const temp = options[0];
  options[0] = options[seed];
  options[seed] = temp;

  return options;
}

function renderCurrentQuestion() {
  const item = rawData[currentQIndex];
  const card = document.getElementById('currentQCard');
  const isKiller = item.diff.includes('킬러') || item.era.includes('문화재') || item.era.includes('지역사') || item.era.includes('순서') || item.era.includes('문화유산') || item.era.includes('통합');

  const options = getOptionsForItem(item);
  const userAns = userAnswers[item.id];

  let optHtml = '';
  options.forEach((opt, oIdx) => {
    const numLabels = ['①', '②', '③', '④'];
    let cls = '';
    if (userAns !== undefined) {
      if (opt.isCorrect) cls = 'correct-choice';
      else if (userAns.optIdx === oIdx) cls = 'wrong-choice';
    }
    optHtml += `
      <button class="choice-btn ${cls}" onclick="answerSingle(${item.id}, ${oIdx}, ${opt.isCorrect})">
        <span class="choice-num">${numLabels[oIdx]}</span>
        <span class="choice-text">${opt.text}</span>
      </button>
    `;
  });

  card.innerHTML = `
    <div class="q-top-info">
      <div class="badges">
        <span class="badge ${isKiller ? 'badge-killer' : 'badge-era'}">${item.era}</span>
        <span class="badge badge-exam">${item.exam} (${item.no})</span>
        <span class="badge-diff">${item.diff}</span>
      </div>
      <span style="font-size:14px; font-weight:800; color:#1F4E79;">문제 코드 #Q${item.id}</span>
    </div>
    <div class="q-title">[Q${item.id}] ${item.real_title}</div>
    <div class="q-topic-label">📌 핵심 주제: ${item.topic}</div>
    <div class="saryo-box">
      <div class="saryo-header">📜 【 국사편찬위원회 실제 기출 사료 원문 】</div>
      <div style="font-size:15px; color:#1E293B; margin-bottom:12px; font-style:italic;">
        ${item.real_box}
      </div>
      <div style="font-size:12.5px; color:#475569; border-top:1px dashed #CBD5E1; padding-top:8px;">
        🔍 <b>사료 독해 핵심 단서:</b> <span class="kw-tag">${item.clue}</span>
      </div>
    </div>
    <div class="choices-list">${optHtml}</div>
    <div class="expl-box ${userAns !== undefined ? 'show' : ''}" id="expl_${item.id}">
      <div class="expl-title">💡 튜터의 실전 1초 해설 & 정답 연결 공식</div>
      <div><b>공식 정답:</b> ${item.correct}</div>
      <div class="expl-tip">⚡ 1초 암기 공식 팁: ${item.tip}</div>
    </div>
  `;

  document.getElementById('navIndicator').innerText = `Q${item.id} / ${rawData.length}`;
  document.getElementById('btnPrev').disabled = currentQIndex === 0;
  document.getElementById('btnNext').disabled = currentQIndex === rawData.length - 1;

  highlightGrid();
}

function answerSingle(qId, optIdx, isCorrect) {
  userAnswers[qId] = { optIdx, isCorrect };
  saveKhProgress();
  renderCurrentQuestion();
  updateOMRStats();
  highlightGrid();
}

function navQuestion(delta) {
  const newIdx = currentQIndex + delta;
  if (newIdx >= 0 && newIdx < rawData.length) {
    currentQIndex = newIdx;
    window.location.hash = '#q' + rawData[currentQIndex].id;
    saveKhProgress();
    renderCurrentQuestion();
  }
}

function goToQuestion(idx) {
  currentQIndex = idx;
  window.location.hash = '#q' + rawData[currentQIndex].id;
  saveKhProgress();
  if (currentMode === 'single') {
    renderCurrentQuestion();
  } else {
    const el = document.getElementById('card_q' + rawData[idx].id);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }
}

function jumpToNum() {
  const val = parseInt(document.getElementById('jumpNum').value, 10);
  if (val >= 1 && val <= rawData.length) {
    const idx = rawData.findIndex(item => item.id === val);
    if (idx !== -1) {
      goToQuestion(idx);
      document.getElementById('jumpNum').value = '';
    }
  } else {
    alert("1부터 " + rawData.length + " 사이의 번호를 입력해주세요.");
  }
}

function updateOMRStats() {
  const solved = Object.keys(userAnswers).length;
  let correctCount = 0;
  Object.values(userAnswers).forEach(a => { if (a.isCorrect) correctCount++; });
  const score = Math.round((correctCount / rawData.length) * 100);
  document.getElementById('omrScore').innerText = `${solved} / ${rawData.length} 풀이 (정답률 ${solved > 0 ? Math.round((correctCount/solved)*100) : 0}%)`;
}

function setMode(mode) {
  currentMode = mode;
  const singleBox = document.getElementById('singleModeContainer');
  const allBox = document.getElementById('allModeContainer');
  const expBox = document.getElementById('explainModeContainer');
  const excelBox = document.getElementById('excelModeContainer');

  const btnSingle = document.getElementById('btnSingleMode');
  const btnAll = document.getElementById('btnAllMode');
  const btnExp = document.getElementById('btnExplainMode');

  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));

  if (mode === 'single') {
    if (singleBox) singleBox.style.display = 'block';
    if (allBox) allBox.style.display = 'none';
    if (expBox) expBox.style.display = 'none';
    if (excelBox) excelBox.style.display = 'none';

    if (btnSingle) btnSingle.classList.add('active');
    renderCurrentQuestion();
  } else if (mode === 'all') {
    if (singleBox) singleBox.style.display = 'none';
    if (allBox) allBox.style.display = 'block';
    if (expBox) expBox.style.display = 'none';
    if (excelBox) excelBox.style.display = 'none';

    if (btnAll) btnAll.classList.add('active');
    renderAllQuestions();
    setTimeout(() => {
      const el = document.getElementById('card_q' + rawData[currentQIndex].id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }, 60);
  } else if (mode === 'explain') {
    if (singleBox) singleBox.style.display = 'none';
    if (allBox) allBox.style.display = 'none';
    if (excelBox) excelBox.style.display = 'none';
    if (expBox) expBox.style.display = 'block';

    if (btnExp) btnExp.classList.add('active');
    renderExplainHandbook();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function answerAllMode(qId, optIdx, isCorrect) {
  userAnswers[qId] = { optIdx, isCorrect };
  saveKhProgress();
  updateOMRStats();
  highlightGrid();

  const card = document.getElementById('card_q' + qId);
  if (card) {
    const buttons = card.querySelectorAll('.choice-btn');
    const item = rawData.find(q => q.id === qId);
    const options = item ? getOptionsForItem(item) : [];

    buttons.forEach((btn, idx) => {
      btn.classList.remove('correct-choice', 'wrong-choice');
      if (idx === optIdx) {
        btn.classList.add(isCorrect ? 'correct-choice' : 'wrong-choice');
      }
      if (!isCorrect && options[idx] && options[idx].isCorrect) {
        btn.classList.add('correct-choice');
      }
    });

    const expl = document.getElementById('expl_' + qId);
    if (expl) expl.classList.add('show');
  }
}

function buildExcelTable() {
  const tbody = document.getElementById('excelTableBody');
  if (!tbody) return;
  tbody.innerHTML = '';
  
  rawData.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid #E2E8F0';
    tr.style.cursor = 'pointer';
    tr.id = 'excelRow_' + item.id;
    tr.onmouseover = () => tr.style.backgroundColor = '#F8FAFC';
    tr.onmouseout = () => {
      if (currentQIndex !== idx) tr.style.backgroundColor = 'transparent';
      else tr.style.backgroundColor = '#E0E7FF';
    };
    tr.onclick = () => {
      goToQuestion(idx);
      highlightExcelRow(idx);
    };

    tr.innerHTML = `
      <td style="padding:8px 10px; text-align:center; font-weight:700; color:#1F4E79;">Q${item.id}</td>
      <td style="padding:8px 10px; text-align:center;"><span style="background:#EDF2F7; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:600;">${item.era}</span></td>
      <td style="padding:8px 10px; font-weight:700; color:#0F172A;">${item.topic}</td>
      <td style="padding:8px 10px; color:#334155;"><span style="color:#B45309; font-weight:600;">${item.keyword}</span> ➜ <span style="color:#15803D; font-weight:700;">${item.correct}</span></td>
      <td style="padding:8px 10px; text-align:center;"><button style="background:#1F4E79; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:700; cursor:pointer;">풀기 ▶</button></td>
    `;
    tbody.appendChild(tr);
  });
  highlightExcelRow(currentQIndex);
}

function highlightExcelRow(idx) {
  document.querySelectorAll('#excelTableBody tr').forEach(r => r.style.backgroundColor = 'transparent');
  const targetTr = document.getElementById('excelRow_' + rawData[idx].id);
  if (targetTr) {
    targetTr.style.backgroundColor = '#E0E7FF';
    targetTr.scrollIntoView({ block: 'nearest' });
  }
}

function filterExcelTable() {
  const q = document.getElementById('excelSearch').value.toLowerCase();
  document.querySelectorAll('#excelTableBody tr').forEach(r => {
    r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
  });
}
