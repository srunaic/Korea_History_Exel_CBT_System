<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>7급 공무원 전산직 실전 CBT 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#1F4E79;--bg:#F0F4F8;--card:#fff;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;--correct:#15803D;--wrong:#B91C1C;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);line-height:1.55;}
header{background:linear-gradient(135deg,#0F2A44 0%,#1F4E79 70%,#2563EB 100%);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 4px 14px rgba(15,42,68,.25);}
.hdr-inner{max-width:1260px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.hdr-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;}
.hdr-brand h1{font-size:1.1rem;font-weight:800;white-space:nowrap;}
.hdr-brand p{font-size:.72rem;opacity:.85;white-space:nowrap;}
.hdr-icon{font-size:22px;background:rgba(255,255,255,.15);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;flex-shrink:0;}
.quick-links{display:flex;gap:6px;flex-wrap:wrap;}
.btn-q{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:.75rem;font-weight:700;white-space:nowrap;transition:.2s;display:inline-flex;align-items:center;gap:3px;}
.btn-q:hover{background:rgba(255,255,255,.28);transform:translateY(-1px);}

/* Subject Tabs */
.subject-bar{max-width:1260px;margin:14px auto 0;padding:0 14px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:6px;}
.subject-bar::-webkit-scrollbar{display:none;}
.subject-bar .sep{width:2px;background:#CBD5E1;border-radius:2px;flex-shrink:0;margin:4px 2px;}
.stab{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:5px;flex-shrink:0;color:var(--text);}
.stab:hover{border-color:#94A3B8;transform:translateY(-1px);}
.stab.active{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.grp-label{font-size:.65rem;font-weight:800;color:var(--muted);white-space:nowrap;padding:0 4px;flex-shrink:0;align-self:center;letter-spacing:.5px;}

/* Main Grid */
.cbt-wrap{max-width:1260px;margin:14px auto 40px;padding:0 14px;display:grid;grid-template-columns:1fr 300px;gap:16px;}
.left{display:flex;flex-direction:column;gap:14px;min-width:0;}
.right{display:flex;flex-direction:column;gap:14px;min-width:0;}

/* Question Card */
.q-card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 3px 12px rgba(0,0,0,.05);border:1.5px solid var(--border);}
.q-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.badge{padding:4px 10px;border-radius:6px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.q-num-badge{background:#FEF3C7;color:#92400E;}
.q-text{font-size:1rem;font-weight:600;line-height:1.7;margin-bottom:18px;word-break:keep-all;}
.q-text pre{background:#F1F5F9;padding:12px;border-radius:8px;font-size:.85rem;overflow-x:auto;margin:8px 0;white-space:pre-wrap;font-family:'Pretendard',monospace;}

/* Choice Buttons */
#choicesBox{display:flex;flex-direction:column;gap:8px;}
.ch-btn{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:.2s;text-align:left;font-size:.9rem;line-height:1.55;word-break:keep-all;}
.ch-btn:hover{border-color:#94A3B8;background:#F8FAFC;}
.ch-btn.selected{border-color:var(--primary);background:#EFF6FF;}
.ch-btn.correct-mark{border-color:var(--correct);background:#F0FDF4;}
.ch-btn.wrong-mark{border-color:var(--wrong);background:#FEF2F2;}
.ch-label{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#475569;}
.ch-btn.correct-mark .ch-label{background:var(--correct);color:#fff;}
.ch-btn.wrong-mark .ch-label{background:var(--wrong);color:#fff;}

/* Explanation */
#explBox{display:none;background:#FFFBEB;border:1.5px solid #FDE68A;border-radius:10px;padding:18px;margin-top:14px;}
#explBox.show{display:block;}
.expl-title{font-weight:800;color:#92400E;margin-bottom:8px;font-size:.9rem;}
.expl-body{font-size:.88rem;line-height:1.75;color:#78350F;}
.expl-kw{margin-top:10px;font-size:.82rem;color:#A16207;background:#FEF9C3;padding:8px 12px;border-radius:6px;}

/* Nav Buttons */
.nav-row{display:flex;gap:10px;justify-content:space-between;margin-top:6px;}
.nav-btn{padding:10px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:.85rem;font-weight:700;cursor:pointer;transition:.2s;}
.nav-btn:hover{background:#F1F5F9;}
.nav-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}

/* Sidebar */
.side-card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.05);border:1.5px solid var(--border);}
.side-title{font-size:.95rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.score-item{text-align:center;padding:10px;background:#F8FAFC;border-radius:8px;border:1px solid var(--border);}
.score-val{font-size:1.4rem;font-weight:900;}
.score-lbl{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px;}

/* Answer Grid */
#gridBox{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:5px;}
.g-btn{width:100%;aspect-ratio:1;border-radius:6px;border:1.5px solid var(--border);background:#F8FAFC;font-size:.72rem;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;color:var(--text);}
.g-btn:hover{border-color:#94A3B8;transform:scale(1.05);}
.g-btn.current{border-color:var(--primary);background:#DBEAFE;color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,121,.2);}
.g-btn.answered{background:#E0E7FF;border-color:#818CF8;color:#4338CA;}
.g-btn.correct-g{background:#DCFCE7;border-color:var(--correct);color:var(--correct);}
.g-btn.wrong-g{background:#FEE2E2;border-color:var(--wrong);color:var(--wrong);}

/* Subject Progress */
.subj-progress{margin-top:14px;}
.sp-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F1F5F9;font-size:.78rem;}
.sp-item:last-child{border-bottom:none;}
.sp-name{font-weight:600;display:flex;align-items:center;gap:4px;}
.sp-stat{font-weight:700;color:var(--primary);}

/* Mobile */
@media(max-width:768px){
  header{padding:10px 12px;}
  .hdr-inner{flex-direction:column;align-items:stretch;gap:8px;}
  .hdr-brand h1{font-size:.95rem;}
  .quick-links{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
  .quick-links::-webkit-scrollbar{display:none;}
  .btn-q{padding:5px 8px;font-size:.7rem;}
  .subject-bar{margin-top:10px;padding:0 10px;}
  .stab{padding:7px 11px;font-size:.72rem;}
  .cbt-wrap{grid-template-columns:1fr;padding:0 10px;margin-top:10px;}
  .q-card{padding:16px;}
  .q-text{font-size:.92rem;}
  .ch-btn{padding:10px 12px;font-size:.85rem;}
  .nav-btn{padding:8px 14px;font-size:.8rem;}
  #gridBox{grid-template-columns:repeat(5,1fr);}
}
body, html { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; }
input, textarea { -webkit-user-select: text !important; -moz-user-select: text !important; user-select: text !important; }
@media print { html, body { display: none !important; } }
</style>
<script>
// [Security & Anti-Theft Protection]
document.addEventListener('contextmenu', e => e.preventDefault(), {capture: true});
document.addEventListener('keydown', e => {
  if (e.keyCode === 123 || ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.keyCode === 83 || (e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67))))){
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, {capture: true});
document.addEventListener('copy', e => {
  if (window.getSelection && window.getSelection().toString().length > 0) {
    e.preventDefault();
    if (e.clipboardData) e.clipboardData.setData('text/plain', '※ 본 콘텐츠의 무단 복제 및 2차 배포는 저작권법에 의해 엄격히 금지됩니다. (Copyright © 2026 Mokha)');
  }
}, {capture: true});

// [Anti-Macro & Anti-Bot Defense]
(function(){
  var lastT = 0, clicks = 0, blockT = 0;
  window.addEventListener('click', function(e){
    var now = performance.now();
    if (now < blockT) { e.stopImmediatePropagation(); e.preventDefault(); return false; }
    if (e.isTrusted === false || window.navigator.webdriver) {
      alert('⚠️ 비정상적인 매크로/자동화 동작이 감지되어 차단되었습니다.');
      blockT = now + 5000; e.stopImmediatePropagation(); e.preventDefault(); return false;
    }
    if (now - lastT < 65) {
      clicks++;
      if (clicks > 3) {
        alert('⚠️ 초고속 반복 클릭(매크로 의심)으로 인해 3초간 입력이 제한됩니다.');
        blockT = now + 3000; e.stopImmediatePropagation(); e.preventDefault(); return false;
      }
    } else { clicks = 0; }
    lastT = now;
  }, {capture: true});
})();
</script>
</head>
<body>
<header>
  <div class="hdr-inner">
    <a href="civil_service_schedule.html" class="hdr-brand">
      <div class="hdr-icon">🏛️</div>
      <div>
        <h1>7급 공무원 전산직 실전 CBT 모의고사</h1>
        <p>PSAT · 헌법 · 자료구조 · DB · SW공학 · 보안 · 네트워크</p>
      </div>
    </a>
    <div class="quick-links">
      <a href="civil_service_schedule.html" class="btn-q">🏛️ 공무원 일정</a>
      <a href="exam_schedule.html" class="btn-q">📅 종합 일정</a>
      <a href="cbt_player.html" class="btn-q">🇰🇷 한국사 CBT</a>
      <a href="toeic_cbt.html" class="btn-q">🇬🇧 토익 CBT</a>
      <a href="Engineer_Information_exam_schedule.html" class="btn-q">💻 정처기</a>
    </div>
  </div>
</header>

<nav class="subject-bar" id="subjectBar">
  <span class="grp-label">1차▸</span>
  <button class="stab active" data-subj="psat-verbal">🧠 언어논리</button>
  <button class="stab" data-subj="psat-data">📊 자료해석</button>
  <button class="stab" data-subj="psat-situation">🎯 상황판단</button>
  <button class="stab" data-subj="constitution">⚖️ 헌법</button>
  <div class="sep"></div>
  <span class="grp-label">2차▸</span>
  <button class="stab" data-subj="data-structure">🌲 자료구조론</button>
  <button class="stab" data-subj="database">🗄️ DB론</button>
  <button class="stab" data-subj="software-eng">⚙️ SW공학</button>
  <button class="stab" data-subj="security">🔐 정보보호론</button>
  <button class="stab" data-subj="network">🌐 네트워크</button>
</nav>

<main class="cbt-wrap">
  <div class="left">
    <div class="q-card">
      <div class="q-top">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <span class="badge" id="subjBadge">🧠 언어논리</span>
          <span class="badge q-num-badge" id="qNumBadge">Q1 / 5</span>
        </div>
        <span style="font-size:.78rem;color:var(--muted);font-weight:600;" id="qCategory"></span>
      </div>
      <div class="q-text" id="qText"></div>
      <div id="choicesBox"></div>
      <div id="explBox">
        <div class="expl-title">📝 정답 해설</div>
        <div class="expl-body" id="explBody"></div>
        <div class="expl-kw" id="explKw"></div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="btnPrev" onclick="nav(-1)">◀ 이전 문제</button>
      <button class="nav-btn primary" id="btnNext" onclick="nav(1)">다음 문제 ▶</button>
    </div>
  </div>

  <div class="right">
    <div class="side-card">
      <div class="side-title">📊 현재 과목 성적</div>
      <div class="score-grid">
        <div class="score-item"><div class="score-val" id="scAnswered" style="color:var(--primary)">0</div><div class="score-lbl">풀이 완료</div></div>
        <div class="score-item"><div class="score-val" id="scTotal">5</div><div class="score-lbl">전체 문항</div></div>
        <div class="score-item"><div class="score-val" id="scCorrect" style="color:var(--correct)">0</div><div class="score-lbl">정답</div></div>
        <div class="score-item"><div class="score-val" id="scRate" style="color:#D97706">0%</div><div class="score-lbl">정답률</div></div>
      </div>
      <div class="side-title">🔢 답안 표기판</div>
      <div id="gridBox"></div>
    </div>
    <div class="side-card">
      <div class="side-title">📈 전 과목 진도</div>
      <div id="progressList" class="subj-progress"></div>
    </div>
  </div>
</main>

<script>
/* ===========================
   QUESTION DATA (9과목 × 5문항 = 45문항)
   =========================== */
const SUBJECTS = {
  'psat-verbal': {
    name:'PSAT 언어논리', icon:'🧠', color:'#6366F1',
    questions:[
      {q:'다음 논증에서 결론을 가장 강화하는 전제를 고르시오.\n\n결론: "원격근무 도입은 조직 생산성을 향상시킨다."\n전제1: 최근 설문조사에서 직원 73%가 원격근무에 만족한다고 응답했다.',
       opts:['원격근무 도입 후 이직률이 15% 감소하고 프로젝트 완료율이 22% 증가했다.','원격근무를 도입한 회사의 주가가 상승했다.','원격근무 시 직원 간 비공식 대화가 줄어든다.','일부 직원은 원격근무보다 사무실 근무를 선호한다.'],
       ans:0, expl:'결론은 "생산성 향상"이므로, 이직률 감소와 프로젝트 완료율 증가라는 구체적 성과 지표를 제시하는 ①이 가장 직접적으로 결론을 강화합니다.', kw:'논증 강화·구체적 근거·생산성 지표'},
      {q:'다음 중 논리적 오류가 포함된 주장은?\n\n① A 후보는 경제 전문가이므로 외교 문제에 대한 그의 견해도 옳다.\n② 모든 포유류는 척추동물이고, 고래는 포유류이므로 고래는 척추동물이다.\n③ 범죄율이 증가한 해에 아이스크림 판매도 증가했으므로, 이 둘은 공통 원인(기온)을 가질 수 있다.\n④ 전제가 참이면 결론이 반드시 참인 논증은 타당한 논증이다.',
       opts:['①','②','③','④'],
       ans:0, expl:'①은 "권위에의 호소(전문성 영역 이탈)" 오류입니다. 경제 전문성이 외교 문제에 대한 전문성을 보장하지 않습니다.', kw:'권위에의 호소·논리적 오류·전문성 영역'},
      {q:'다음 주장의 숨은 전제(암묵적 가정)로 가장 적절한 것은?\n\n"김 과장은 정보보안 자격증을 보유하고 있으므로 이번 보안 감사팀장을 맡아야 한다."',
       opts:['자격증 보유자가 해당 분야 업무 수행에 적합하다.','김 과장이 부서에서 가장 연차가 높다.','보안 감사는 반드시 외부 전문가가 수행해야 한다.','자격증은 시험에 합격해야 취득할 수 있다.'],
       ans:0, expl:'주장의 구조: 자격증 보유(전제) → 팀장 적합(결론). 이를 연결하는 숨은 전제는 "자격증 보유 = 업무 적합성"이라는 ①의 가정입니다.', kw:'숨은 전제·암묵적 가정·논증 구조 분석'},
      {q:'甲의 주장: "모든 공직자는 청렴해야 하며, 공직자의 재산은 반드시 공개되어야 한다."\n\n다음 중 甲의 주장에 대한 가장 효과적인 반론은?',
       opts:['재산 공개가 오히려 유능한 인재의 공직 진출을 저해한다는 실증 연구 결과가 있다.','모든 국민의 재산도 공개되어야 한다.','청렴한 공직자는 재산 공개를 두려워하지 않는다.','재산 공개 제도는 다른 나라에서도 시행하고 있다.'],
       ans:0, expl:'효과적 반론은 주장이 가져올 부정적 결과를 실증적으로 제시하는 것입니다. ①은 재산공개→인재 유출이라는 역효과를 근거로 반박합니다.', kw:'반론·실증적 반박·부정적 결과 제시'},
      {q:'다음 문장들을 논리적 순서로 올바르게 배열한 것은?\n\n㈎ 그 결과, 전자정부 만족도가 OECD 국가 중 1위를 기록했다.\n㈏ 한국은 1990년대 후반부터 정보화 기반 구축에 집중 투자했다.\n㈐ 이를 바탕으로 2000년대 이후 행정업무의 전면 디지털화를 추진했다.\n㈑ 국민들은 각종 민원을 온라인으로 처리할 수 있게 되었다.',
       opts:['㈏-㈐-㈑-㈎','㈏-㈑-㈐-㈎','㈎-㈏-㈐-㈑','㈐-㈏-㈑-㈎'],
       ans:0, expl:'시간적·인과적 순서: 기반 구축(㈏) → 디지털화 추진(㈐) → 온라인 민원(㈑) → 결과 1위(㈎)', kw:'문장 배열·시간적 순서·인과 관계'}
    ]
  },
  'psat-data': {

/* ===========================
   STATE MANAGEMENT (중앙집중식 - 버그 방지 핵심)
   =========================== */
const STATE = {
  currentSubject: 'psat-verbal',
  currentQIndex: 0,
  answers: {} // { subjectKey: { qIdx: choiceIdx } }
};

function getQ() {
  return SUBJECTS[STATE.currentSubject].questions[STATE.currentQIndex];
}
function getAnswers() {
  if (!STATE.answers[STATE.currentSubject]) STATE.answers[STATE.currentSubject] = {};
  return STATE.answers[STATE.currentSubject];
}
function totalQ() { return SUBJECTS[STATE.currentSubject].questions.length; }

/* ===========================
   RENDER FUNCTIONS
   =========================== */
function renderSubjectTabs() {
  document.querySelectorAll('.stab').forEach(t => {
    const key = t.dataset.subj;
    const isActive = key === STATE.currentSubject;
    t.classList.toggle('active', isActive);
    t.style.background = isActive ? SUBJECTS[key].color : '';
    t.style.color = isActive ? '#fff' : '';
    t.style.borderColor = isActive ? 'transparent' : '';
  });
}

function renderQuestion() {
  const subj = SUBJECTS[STATE.currentSubject];
  const q = getQ();
  const ans = getAnswers();
  const userAns = ans[STATE.currentQIndex];
  const answered = userAns !== undefined;

  document.getElementById('subjBadge').textContent = subj.icon + ' ' + subj.name;
  document.getElementById('subjBadge').style.background = subj.color + '22';
  document.getElementById('subjBadge').style.color = subj.color;
  document.getElementById('qNumBadge').textContent = 'Q' + (STATE.currentQIndex+1) + ' / ' + totalQ();
  document.getElementById('qCategory').textContent = '';
  document.getElementById('qText').innerHTML = q.q.replace(/\n/g,'<br>').replace(/&lt;pre&gt;/g,'<pre>').replace(/&lt;\/pre&gt;/g,'</pre>');

  // Choices
  const box = document.getElementById('choicesBox');
  const labels = ['A','B','C','D','E'];
  let html = '';
  q.opts.forEach((opt, i) => {
    let cls = 'ch-btn';
    if (answered) {
      if (i === q.ans) cls += ' correct-mark';
      else if (i === userAns && userAns !== q.ans) cls += ' wrong-mark';
    } else if (i === userAns) {
      cls += ' selected';
    }
    html += '<button class="' + cls + '" data-choice-idx="' + i + '">' +
            '<span class="ch-label">' + labels[i] + '</span>' +
            '<span>' + opt + '</span></button>';
  });
  box.innerHTML = html;

  // Explanation
  const explBox = document.getElementById('explBox');
  if (answered) {
    explBox.classList.add('show');
    document.getElementById('explBody').innerHTML = (userAns === q.ans ? '✅ 정답입니다! ' : '❌ 오답입니다. 정답: ' + labels[q.ans] + '<br><br>') + q.expl;
    document.getElementById('explKw').textContent = '🔑 핵심 키워드: ' + q.kw;
  } else {
    explBox.classList.remove('show');
  }

  // Nav buttons
  document.getElementById('btnPrev').disabled = STATE.currentQIndex === 0;
  document.getElementById('btnNext').textContent = STATE.currentQIndex < totalQ()-1 ? '다음 문제 ▶' : '✅ 풀이 완료';
}

function renderGrid() {
  const ans = getAnswers();
  const subj = SUBJECTS[STATE.currentSubject];
  let html = '';
  for (let i = 0; i < totalQ(); i++) {
    let cls = 'g-btn';
    if (i === STATE.currentQIndex) cls += ' current';
    if (ans[i] !== undefined) {
      cls += ans[i] === subj.questions[i].ans ? ' correct-g' : ' wrong-g';
    }
    html += '<button class="' + cls + '" data-q-idx="' + i + '">P' + (i+1) + '</button>';
  }
  document.getElementById('gridBox').innerHTML = html;
}

function renderScore() {
  const ans = getAnswers();
  const total = totalQ();
  let answered = 0, correct = 0;
  for (let i = 0; i < total; i++) {
    if (ans[i] !== undefined) {
      answered++;
      if (ans[i] === SUBJECTS[STATE.currentSubject].questions[i].ans) correct++;
    }
  }
  document.getElementById('scAnswered').textContent = answered;
  document.getElementById('scTotal').textContent = total;
  document.getElementById('scCorrect').textContent = correct;
  document.getElementById('scRate').textContent = answered > 0 ? Math.round(correct/answered*100) + '%' : '0%';
}

function renderProgress() {
  let html = '';
  for (const [key, subj] of Object.entries(SUBJECTS)) {
    const ans = STATE.answers[key] || {};
    const total = subj.questions.length;
    let done = 0, correct = 0;
    for (let i = 0; i < total; i++) {
      if (ans[i] !== undefined) { done++; if (ans[i] === subj.questions[i].ans) correct++; }
    }
    const isCurr = key === STATE.currentSubject;
    html += '<div class="sp-item" style="' + (isCurr ? 'background:#F0F9FF;border-radius:6px;padding:6px 8px;' : '') + '">' +
            '<span class="sp-name">' + subj.icon + ' ' + subj.name + '</span>' +
            '<span class="sp-stat">' + done + '/' + total + (done > 0 ? ' (' + correct + '✓)' : '') + '</span></div>';
  }
  document.getElementById('progressList').innerHTML = html;
}

function renderAll() {
  renderSubjectTabs();
  renderQuestion();
  renderGrid();
  renderScore();
  renderProgress();
}

/* ===========================
   EVENT HANDLERS (이벤트 위임 - 버그 방지 핵심)
   =========================== */

// Subject tab switching
document.getElementById('subjectBar').addEventListener('click', function(e) {
  const tab = e.target.closest('[data-subj]');
  if (!tab) return;
  STATE.currentSubject = tab.dataset.subj;
  STATE.currentQIndex = 0;
  renderAll();
  // Scroll tab into view
  tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
});

// Choice selection (이벤트 위임)
document.getElementById('choicesBox').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-choice-idx]');
  if (!btn) return;
  const ans = getAnswers();
  if (ans[STATE.currentQIndex] !== undefined) return; // already answered
  ans[STATE.currentQIndex] = parseInt(btn.dataset.choiceIdx);
  renderQuestion();
  renderGrid();
  renderScore();
  renderProgress();
});

// Answer grid navigation (이벤트 위임)
document.getElementById('gridBox').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-q-idx]');
  if (!btn) return;
  STATE.currentQIndex = parseInt(btn.dataset.qIdx);
  renderQuestion();
  renderGrid();
});

// Prev/Next navigation
function nav(dir) {
  const newIdx = STATE.currentQIndex + dir;
  if (newIdx < 0 || newIdx >= totalQ()) return;
  STATE.currentQIndex = newIdx;
  renderQuestion();
  renderGrid();
}

// Keyboard shortcuts
window.addEventListener('keydown', function(e) {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') nav(-1);
  if (e.key === 'ArrowRight') nav(1);
  if (['1','2','3','4'].includes(e.key)) {
    const ans = getAnswers();
    if (ans[STATE.currentQIndex] !== undefined) return;
    ans[STATE.currentQIndex] = parseInt(e.key) - 1;
    renderQuestion(); renderGrid(); renderScore(); renderProgress();
  }
});

// Initial render
renderAll();
</script>
</body>
</html>
